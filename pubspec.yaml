name: mood_music
description: Base modular de MoodMusic.
publish_to: none
version: 1.1.0-dev.1+4
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  audio_service: 0.18.19
  audio_session: 0.2.4
  cloud_firestore: ^6.10.0
  crypto: ^3.0.7
  file_picker: 13.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  just_audio: 0.10.6
  moodmusic_local_media:
    path: packages/moodmusic_local_media
  path_provider: ^2.1.6
  shared_preferences: '>=2.3.0 <3.0.0'
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - hosting_audio/audio/viva-la-vida.mp3
    - hosting_audio/covers/viva-la-vida.jpg
